# Désactive le seeding automatique des données de démo pendant les tests.
# Les tests du seeder appellent explicitement DemoDataInitializer.seedDemoData().
imomswms.demo-data.enabled=false

# Port HTTP des tests Quarkus : 8081 est occupé par le serveur dev (quarkus dev),
# les @QuarkusTest écoutent donc sur 8082 pour éviter le conflit de port.
quarkus.http.test-port=8082
