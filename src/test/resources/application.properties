# Désactive le seeding automatique des données de démo pendant les tests.
# Les tests du seeder appellent explicitement DemoDataInitializer.seedDemoData().
imomswms.demo-data.enabled=false

# Port éphémère : les contextes de test ne se disputent aucun port fixe
# et restent indépendants des serveurs locaux. RestAssured reçoit le port réel.
quarkus.http.test-port=0

# Business polling is invoked explicitly by tests; background jobs must not mutate
# another fixture or race a Quarkus profile shutdown.
quarkus.scheduler.enabled=false
# Keep errors and slow-query diagnostics; GraphQL schema debug is not test evidence.
quarkus.log.category."io.smallrye.graphql".level=WARN
