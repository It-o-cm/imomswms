# HTTP backend
quarkus.http.port=8040

# ==========================================
# Configuration de la base de données
# ==========================================
quarkus.datasource.db-kind=h2
quarkus.datasource.username=${DATABASE_USER:username}
quarkus.datasource.password=${DATABASE_PASSWORD:password}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:h2:file:./data/imomswms}
# Dev interruptions must not close the shared database FileChannel.
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:h2:async:./data/imomswms}

# Configuration Hibernate
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
# Flag database statements taking more than 100 ms; no bind values logged.
quarkus.hibernate-orm.log.queries-slower-than-ms=100
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=WARN
quarkus.hibernate-orm.jdbc.batch_size=1000
quarkus.hibernate-orm.jdbc.order_inserts=true
quarkus.hibernate-orm.jdbc.order_updates=true
quarkus.hibernate-orm.open-session-in-view=true

# ==========================================
# Logs & Général
# ==========================================
quarkus.log.min-level=DEBUG
quarkus.log.level=INFO
quarkus.log.category."com.intermarche".level=DEBUG
quarkus.log.category."stdout".level=INFO

quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

# Enable Virtual Threads (Project Loom)
quarkus.threading.virtual.enabled=true

# ==========================================
# Profil Actif (Force le mode DEV)
# ==========================================
# Cela active vos beans annotés avec @IfBuildProfile("dev")
quarkus.profile=dev

# ==========================================
# Authentification & Sécurité (RS256)
# ==========================================

# --- 1. Configuration MODE DEV (JWT locaux) ---
%dev.quarkus.oidc.enabled=false

# Propriétés factices (Obligatoires pour votre code)
%dev.quarkus.oidc.auth-server-url=http://dummy-server
%dev.quarkus.oidc.client-id=dummy-client
%dev.quarkus.oidc.credentials.secret=dummy-secret

# --- 2. Configuration RS256 ---
# Algorithme
%dev.mp.jwt.verify.algorithm=RS256

# Paire de clés propre à chaque installation, hors des sources : créée au premier
# démarrage par LocalJwtKeys dans data/jwt (ignoré par git). La supprimer invalide
# toutes les sessions ouvertes.
%dev.mp.jwt.verify.publickey.location=file:data/jwt/publicKey.pem
%dev.smallrye.jwt.sign.key.location=file:data/jwt/privateKey.pem

# Métadonnées
%dev.mp.jwt.verify.issuer=https://intermarche-dev.com
%dev.mp.jwt.verify.audiences=backoffice-api

%dev.quarkus.log.category."io.smallrye.jwt".level=INFO
%dev.quarkus.log.category."io.quarkus.security".level=INFO
%dev.quarkus.log.category."io.vertx.ext.web".level=INFO

# ==========================================
# Email & Password Reset
# ==========================================

# URL de l'application Frontend pour construire les liens (ex: http://localhost:3000)
%dev.app.frontend.url=http://localhost:3000

# Configuration SMTP Gmail
%dev.quarkus.mailer.host=smtp.gmail.com
%dev.quarkus.mailer.port=587
%dev.quarkus.mailer.username=hdarmet@gmail.com
# Mot de passe d'application Gmail lu dans .env (MAILER_PASSWORD), jamais dans les sources
%dev.quarkus.mailer.password=${MAILER_PASSWORD:}
%dev.quarkus.mailer.starttls=true
%dev.quarkus.mailer.auth=true
%dev.quarkus.mailer.from=hdarmet@gmail.com
%dev.quarkus.mailer.mock=false

# ==========================================
# Politique d'accès HTTP
# ==========================================

# 1. Permission 'public' : Accès sans authentification
# Permet d'appeler /auth/login et /auth/password-reset/* sans avoir encore de token.
# GraphQL (schéma compris) et OpenAPI exigent un jeton ; seule la Dev UI, servie en
# développement sur la machine locale, reste ouverte.
quarkus.http.auth.permission.public.paths=/auth/*, /q/dev-ui/*, /q/dev/*
quarkus.http.auth.permission.public.policy=permit

# 2. Permission 'authenticated' : Accès avec authentification
# Tout le reste de l'API nécessite un token valide et les bons rôles.
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Activation de CORS (Sécurité entre les ports)
quarkus.http.cors.enabled=true
# Les origines autorisées (Le port où tourne React, généralement 5173 pour Vite)
# Si vous utilisez Create React App, remplacez 5173 par 3000
quarkus.http.cors.origins=http://localhost:3000
# Méthodes HTTP autorisées
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
# Entêtes autorisés (pour envoyer le JSON)
quarkus.http.cors.headers=Content-Type,Authorization
# Permettre l'envoi de cookies/credentials (si nécessaire plus tard)
quarkus.http.cors.allow-credentials=true

quarkus.log.category."io.smallrye.graphql".level=DEBUG
# Bornes des requêtes GraphQL : une requête imbriquée à l'excès (magasin -> bâtiments
# -> magasin -> ...) est refusée avant exécution.
quarkus.smallrye-graphql.instrumentation-query-depth=15
quarkus.smallrye-graphql.instrumentation-query-complexity=2000

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
%dev.quarkus.datasource.h2.console.enabled=true
%dev.quarkus.datasource.h2.console.path=/h2-console

# ==========================================
# Profil TEST (pour les tests @QuarkusTest)
# ==========================================
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=http://dummy-server
%test.quarkus.oidc.client-id=dummy-client
%test.quarkus.oidc.credentials.secret=dummy-secret
%test.mp.jwt.verify.algorithm=RS256
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%test.mp.jwt.verify.issuer=https://intermarche-dev.com
%test.mp.jwt.verify.audiences=backoffice-api
%test.app.frontend.url=http://localhost:3000
%test.quarkus.mailer.host=localhost
%test.quarkus.mailer.port=1025
%test.quarkus.mailer.mock=true
# Natural language rule drafts (same provider as imvaluation).
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Preserve demo plans and replenishments across development hot reloads.
# Hibernate never alters application tables, including during development reloads.

# Offline semantic product matching. Install assets with scripts/install-embedding-model.py.
imomswms.embeddings.enabled=true
imomswms.embeddings.model-directory=${EMBEDDING_MODEL_DIRECTORY:models/multilingual-e5-small}
%test.imomswms.embeddings.enabled=false
# Carrier tour stops: positions of addresses without coordinates are looked up in the Base Adresse Nationale.
imomswms.geocoding.enabled=true
imomswms.geocoding.url=https://api-adresse.data.gouv.fr/search/
%test.imomswms.geocoding.enabled=false
# Road itineraries of carrier tours by the Google Maps Directions web service (server key, not restricted to browsers).
imomswms.directions.key=${GMAP_SERVER_API_KEY:${GMAP_API_KEY:}}
%test.imomswms.directions.key=
# Les tests joignent des imprimantes simulées sur la boucle locale ; ailleurs, réseau du magasin et ports d'impression seulement.
%test.imomswms.printing.allow-loopback=true
# Toutes les requêtes des tests viennent de la boucle locale : les plafonds par adresse
# (testés unitairement) ne doivent pas mêler les tests entre eux ; les plafonds par
# identifiant restent ceux de la configuration.
%test.imomswms.login.max-failures-per-address=100000
%test.imomswms.password-reset.max-requests-per-address=100000
# JNI libraries must survive Quarkus development reloads and test profile changes.
quarkus.class-loading.parent-first-artifacts=com.microsoft.onnxruntime:onnxruntime,ai.djl.huggingface:tokenizers,ai.djl:api,com.google.code.gson:gson,net.java.dev.jna:jna,org.apache.commons:commons-compress,commons-io:commons-io,commons-codec:commons-codec,org.slf4j:slf4j-api,org.jboss.slf4j:slf4j-jboss-logmanager

# Versioned schema (H2). Legacy adoption is guarded by LegacySchemaCallback.
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.validate-migration-naming=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.clean-at-start=false
quarkus.flyway.repair-at-start=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=Verified legacy schema V1
quarkus.flyway.out-of-order=false
imomswms.database.backup-directory=${DATABASE_BACKUP_DIRECTORY:data/backups}
quarkus.flyway.callbacks=com.intermarche.backoffice.database.LegacySchemaCallback
quarkus.hibernate-orm.sql-load-script=no-file
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
