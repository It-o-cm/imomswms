# ==========================================
# Configuration de la base de données
# ==========================================
quarkus.datasource.db-kind=h2
quarkus.datasource.username=username
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Configuration Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE
quarkus.hibernate-orm.jdbc.batch_size=1000
quarkus.hibernate-orm.jdbc.order_inserts=true
quarkus.hibernate-orm.jdbc.order_updates=true
quarkus.hibernate-orm.open-session-in-view=true

# ==========================================
# Logs & Général
# ==========================================
quarkus.log.min-level=DEBUG
quarkus.log.level=INFO
quarkus.log.category."com.intermarche".level=DEBUG
quarkus.log.category."stdout".level=INFO

quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

# Enable Virtual Threads (Project Loom)
quarkus.threading.virtual.enabled=true

# ==========================================
# Profil Actif (Force le mode DEV)
# ==========================================
# Cela active vos beans annotés avec @IfBuildProfile("dev")
quarkus.profile=dev

# ==========================================
# Authentification & Sécurité (RS256)
# ==========================================

# --- 1. Configuration MODE DEV (JWT locaux) ---
%dev.quarkus.oidc.enabled=false

# Propriétés factices (Obligatoires pour votre code)
%dev.quarkus.oidc.auth-server-url=http://dummy-server
%dev.quarkus.oidc.client-id=dummy-client
%dev.quarkus.oidc.credentials.secret=dummy-secret

# --- 2. Configuration RS256 ---
# Algorithme
%dev.mp.jwt.verify.algorithm=RS256

# Clé PUBLIQUE pour vérifier (côté serveur Quarkus)
# Pointe vers le fichier dans resources
%dev.mp.jwt.verify.publickey.location=publicKey.pem

# Clé PRIVÉE pour signer (côté génération TokenService)
# Pointe vers le fichier dans resources
%dev.smallrye.jwt.sign.key.location=privateKey.pem

# Métadonnées
%dev.mp.jwt.verify.issuer=https://intermarche-dev.com
%dev.mp.jwt.verify.audiences=backoffice-api

%dev.quarkus.log.category."io.smallrye.jwt".level=TRACE
%dev.quarkus.log.category."io.quarkus.security".level=TRACE
%dev.quarkus.log.category."io.vertx.ext.web".level=TRACE

# ==========================================
# Email & Password Reset
# ==========================================

# URL de l'application Frontend pour construire les liens (ex: http://localhost:3000)
%dev.app.frontend.url=http://localhost:3000

# Configuration SMTP Gmail
%dev.quarkus.mailer.host=smtp.gmail.com
%dev.quarkus.mailer.port=587
%dev.quarkus.mailer.username=hdarmet@gmail.com
%dev.quarkus.mailer.password=fitsokhfalqpgvxy
%dev.quarkus.mailer.starttls=true
%dev.quarkus.mailer.auth=true
%dev.quarkus.mailer.from=hdarmet@gmail.com
%dev.quarkus.mailer.mock=false

# ==========================================
# Politique d'accès HTTP
# ==========================================

# 1. Permission 'public' : Accès sans authentification
# Permet d'appeler /auth/login et /auth/password-reset/* sans avoir encore de token.
quarkus.http.auth.permission.public.paths=/auth/*, /graphql/*, /q/*
quarkus.http.auth.permission.public.policy=permit

# 2. Permission 'authenticated' : Accès avec authentification
# Tout le reste de l'API nécessite un token valide et les bons rôles.
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Activation de CORS (Sécurité entre les ports)
quarkus.http.cors.enabled=true
# Les origines autorisées (Le port où tourne React, généralement 5173 pour Vite)
# Si vous utilisez Create React App, remplacez 5173 par 3000
quarkus.http.cors.origins=http://localhost:3000
# Méthodes HTTP autorisées
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
# Entêtes autorisés (pour envoyer le JSON)
quarkus.http.cors.headers=Content-Type,Authorization
# Permettre l'envoi de cookies/credentials (si nécessaire plus tard)
quarkus.http.cors.allow-credentials=true

quarkus.log.category."io.smallrye.graphql".level=DEBUG

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
%dev.quarkus.datasource.h2.console.enabled=true
%dev.quarkus.datasource.h2.console.path=/h2-console

# ==========================================
# Profil TEST (pour les tests @QuarkusTest)
# ==========================================
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.auth-server-url=http://dummy-server
%test.quarkus.oidc.client-id=dummy-client
%test.quarkus.oidc.credentials.secret=dummy-secret
%test.mp.jwt.verify.algorithm=RS256
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%test.mp.jwt.verify.issuer=https://intermarche-dev.com
%test.mp.jwt.verify.audiences=backoffice-api
%test.app.frontend.url=http://localhost:3000
%test.quarkus.mailer.host=localhost
%test.quarkus.mailer.port=1025
%test.quarkus.mailer.mock=true